services:
  # PostgreSQL 数据库
  postgres:
    image: pgvector/pgvector:pg16
    container_name: generalagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - generalagent-network

  # Redis 缓存
  redis:
    image: redis:6
    container_name: generalagent-redis
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - generalagent-network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: generalagent-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_port:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: "false"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - generalagent-network

  # ppt-mcp
  ppt-mcp:
    build:
      context: ../sub_projects/ppt-mcp
      dockerfile: Dockerfile
    image: generalagent-ppt-mcp:latest
    container_name: generalagent-ppt-mcp
    command: python server.py
    volumes:
      - agent_files:/agent_files
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4810/ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - generalagent-network

  generalagent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: generalagent-server
    image: generalagent-server:latest
    ports:
      - "${AGENT_SERVER_PORT:-8000}:8000"
    command: langgraph up --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ppt-mcp:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_URI: redis://:redis123@redis:6379
      PPT_MCP_URL: "http://ppt-mcp:4810/mcp"
    volumes:
      - agent_files:/agent_files
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/ok" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - generalagent-network

  # 前端服务 - Agent Chat UI
  agent-chat-ui:
    build:
      context: ../sub_projects/agent-chat-ui
      dockerfile: Dockerfile
    image: generalagent-ui:latest
    container_name: generalagent-frontend
    ports:
      - "${AGENT_UI_PORT:-3000}:3000"
    depends_on:
      generalagent:
        condition: service_healthy
    restart: unless-stopped
    environment:
      API_URL: "http://${HOST_IP}:${AGENT_SERVER_PORT:-8000}"
    networks:
      - generalagent-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  agent_files:

networks:
  generalagent-network:
    driver: bridge